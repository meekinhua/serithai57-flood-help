<!doctype html>

<head>
<meta charset="utf-8" />

<meta name="description" content="ดูทีละขั้น มีเสียงอธิบาย: ยื่นขอเงินช่วยเหลือน้ำท่วมทางออนไลน์ที่ claim.bangkok.go.th" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f3ea; --ink: #15201a; --sub: #45504a; --green: #1e6b47; --green2: #154d33; --mint: #e4f0e9;
    --gold: #e0a100; --cream: #fff8e1; --red: #b42318; --card: #ffffff; --line: #dce2dd; --gov: #1d6b4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Sarabun", system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 24px; }
  header { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 10px; }
  header a { color: var(--green2); font-weight: 700; text-decoration: none; font-size: 15px; min-height: 44px; display: flex; align-items: center; }
  header h1 { flex: 1; font-size: 18px; margin: 0; line-height: 1.2; }
  .progress { width: 100%; max-width: 520px; display: flex; gap: 4px; margin: 10px 0 12px; }
  .progress i { flex: 1; height: 6px; border-radius: 3px; background: #d9dcd2; transition: background .3s; }
  .progress i.on { background: var(--green); }

  .stage { width: 100%; max-width: 520px; display: grid; grid-template-columns: 1fr; gap: 14px; }
  .phone { position: relative; margin: 0 auto; width: 270px; height: 470px; border-radius: 34px; background: #111; padding: 12px; box-shadow: 0 18px 40px -18px rgba(0,0,0,.45); }
  .phone::before { content: ""; position: absolute; top: 18px; left: 50%; width: 70px; height: 7px; margin-left: -35px; border-radius: 4px; background: #333; z-index: 3; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 24px; overflow: hidden; background: #fff; }
  .bar { height: 46px; background: var(--gov); color: #fff; display: flex; align-items: flex-end; padding: 0 12px 8px; font-weight: 700; font-size: 13px; gap: 6px; }
  .bar b { background: #fff; color: var(--gov); border-radius: 6px; padding: 0 5px; font-size: 11px; }
  .url { font-size: 11px; color: #555; background: #f1f1f1; margin: 6px 10px 0; border-radius: 8px; padding: 4px 8px; text-align: center; }
  .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .el { border-radius: 12px; padding: 9px 11px; font-size: 13px; line-height: 1.3; opacity: 0; transform: translateY(10px); transition: opacity .45s, transform .45s, box-shadow .3s, background .3s; }
  .el.in { opacity: 1; transform: none; }
  .el.card { background: #fff; border: 1.5px solid var(--line); }
  .el.btn { background: var(--gov); color: #fff; text-align: center; font-weight: 700; }
  .el.ghost { background: #eef3ef; color: var(--green2); font-weight: 700; }
  .el.hot { box-shadow: 0 0 0 3px var(--gold); }
  .el.done { background: var(--mint); border-color: var(--green); }
  .el small { display: block; color: var(--sub); font-size: 11px; margin-top: 2px; }
  .el .chk { float: right; width: 18px; height: 18px; border-radius: 5px; border: 2px solid #9aa59f; text-align: center; line-height: 14px; font-size: 12px; color: #fff; }
  .el.done .chk { background: var(--green); border-color: var(--green); }
  .big { font-size: 22px; font-weight: 800; color: var(--green2); text-align: center; }
  .money { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; }
  .money b { color: var(--green2); text-align: right; }
  .finger { position: absolute; z-index: 5; width: 34px; height: 34px; margin: -6px 0 0 -10px; font-size: 30px; pointer-events: none; opacity: 0; transition: left .8s ease, top .8s ease, opacity .3s; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
  .ripple { position: absolute; z-index: 4; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--gold); pointer-events: none; animation: rip .7s ease-out forwards; }
  @keyframes rip { from { transform: scale(.4); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
  .doc { display: flex; align-items: center; gap: 8px; }
  .doc span:first-child { font-size: 20px; }

  .caption { background: var(--card); border: 2px solid var(--green); border-radius: 18px; padding: 14px 16px; min-height: 120px; }
  .caption .step { color: var(--green); font-weight: 800; font-size: 14px; }
  .caption h2 { margin: 2px 0 6px; font-size: 21px; line-height: 1.25; }
  .caption p { margin: 0; font-size: 17px; line-height: 1.55; }
  .caption .warn { margin-top: 8px; background: var(--cream); border-radius: 10px; padding: 8px 10px; font-size: 15px; }

  .controls { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  button { font: inherit; font-weight: 800; font-size: 17px; min-height: 54px; border-radius: 14px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
  button.main { background: var(--green); border-color: var(--green); color: #fff; }
  button:disabled { opacity: .35; }
  .row2 { display: flex; gap: 8px; }
  .row2 button { flex: 1; min-height: 46px; font-size: 15px; border-width: 1.5px; }
  .note { font-size: 13px; color: var(--sub); text-align: center; margin: 2px 0 0; }

  .start { position: fixed; inset: 0; z-index: 20; background: rgba(21,32,26,.86); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .start .box { background: var(--bg); border-radius: 22px; padding: 22px 18px; max-width: 420px; width: 100%; text-align: center; }
  .start h2 { margin: 6px 0 4px; font-size: 24px; line-height: 1.25; }
  .start p { margin: 0 0 14px; font-size: 17px; color: var(--sub); line-height: 1.5; }
  .start button { width: 100%; margin-top: 8px; }
  .hide { display: none !important; }
  @media (max-width: 759px) { .phone { width: 236px; height: 380px; } .el { padding: 7px 10px; } }
  @media (min-width: 760px) {
    .stage { max-width: 860px; grid-template-columns: 300px 1fr; align-items: start; }
    header, .progress { max-width: 860px; }
  }
  @media (prefers-reduced-motion: reduce) { .el, .finger { transition: none; } .ripple { display: none; } }
</style>
</head>
<body>
<header>
  <a href="/" aria-label="กลับไปบ้านฉัน">‹ บ้านฉัน</a>
  <h1>วิธียื่นขอเงินช่วยเหลือน้ำท่วม กทม.</h1>
</header>
<div class="progress" id="progress" aria-hidden="true"></div>

<main class="stage">
  <div class="phone" aria-hidden="true"><div class="screen" id="screen"></div><div class="finger" id="finger">👆</div></div>
  <div>
    <section class="caption" aria-live="polite">
      <div class="step" id="step"></div>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="warn hide" id="warn"></div>
    </section>
    <div class="controls" style="margin-top: 10px">
      <button id="prev" aria-label="ขั้นก่อนหน้า">‹ ก่อน</button>
      <button id="play" class="main">⏸ หยุด</button>
      <button id="next" aria-label="ขั้นถัดไป">ต่อ ›</button>
    </div>
    <div class="row2" style="margin-top: 8px">
      <button id="sound">🔊 เสียง: เปิด</button>
      <button id="again">↺ ฟังขั้นนี้อีกครั้ง</button>
    </div>
    <p class="note" id="voiceNote"></p>
    <div class="row2" style="margin-top: 10px">
      <button class="main" onclick="window.open('https://claim.bangkok.go.th/','_blank')">ไปยื่นที่ claim.bangkok.go.th ›</button>
    </div>
    <p class="note">ทำโดยทีมอาสาหมู่บ้านสหกรณ์ฯ 4 (เสรีไทย 57) จากหน้าเว็บจริง ณ 7 ต.ค. 69 · ไม่ใช่เว็บของ กทม. · ถ้าหน้าเว็บเปลี่ยน ให้ยึดตามเว็บ กทม.</p>
  </div>
</main>

<div class="start" id="start">
  <div class="box">
    <div style="font-size: 44px">💰</div>
    <h2>ยื่นขอเงินช่วยเหลือน้ำท่วม กทม. ทำเองในมือถือได้</h2>
    <p>ดูทีละขั้น มีเสียงอธิบาย ประมาณ 3 นาที<br /><b style="color: var(--red)">หมดเขต 24 ต.ค. 69</b></p>
    <button class="main" id="goSound">▶ เริ่มดู (มีเสียง)</button>
    <button id="goMute">ดูแบบไม่มีเสียง</button>
  </div>
</div>

    {
      step: "สำคัญ", title: "ถ้าทำออนไลน์ไม่ได้",
      say: "ถ้าไม่มีโฉนดที่ดิน ชื่อในโฉนดไม่ตรงกับคนยื่น หรือบ้านไม่มีเลขที่ ให้ไปยื่นที่สำนักงานเขตบึงกุ่มแทน. ถ้าติดปัญหา ให้ลูกหลานช่วย หรือโทรสายด่วนกรุงเทพมหานคร หนึ่งห้าห้าห้า. ยื่นแล้ว อย่าลืมกด ยื่นแล้ว ในบ้านฉัน เพื่อบันทึกกันลืม.",
      warn: "📞 สายด่วน กทม. 1555 · ยื่นที่สำนักงานเขตบึงกุ่มได้ · หมดเขต 24 ต.ค. 69",
      screen: [
        ["card", "📄 ไม่มีโฉนด / ชื่อไม่ตรง / ไม่มีเลขที่บ้าน<small>→ ยื่นที่สำนักงานเขต</small>"],
        ["card", "👨‍👩‍👧 ให้ลูกหลานช่วยทำ"],
        ["btn", "📞 สายด่วน กทม. 1555"],
        ["ghost", "✓ ยื่นแล้ว (บันทึกกันลืมในบ้านฉัน)", "tap"],
      ],
    },
  ];

  const $ = (id) => document.getElementById(id);
  const screen = $("screen"), finger = $("finger");
  const synth = window.speechSynthesis;
  let i = 0, playing = true, sound = true, timers = [], voice = null, runId = 0;

  // a Thai voice if the phone has one; otherwise the captions carry it
  function pickVoice() {
    if (!synth) return null;
    const vs = synth.getVoices();
    return vs.find((v) => /^th/i.test(v.lang) && /google|premwadee|kanya|narisa/i.test(v.name)) || vs.find((v) => /^th/i.test(v.lang)) || null;
  }
  if (synth) { voice = pickVoice(); synth.onvoiceschanged = () => { voice = pickVoice(); note(); }; }
  function note() { $("voiceNote").textContent = !synth || !voice ? "เครื่องนี้ไม่มีเสียงอ่านภาษาไทย · อ่านคำบรรยายด้านบนแทนได้ เลื่อนเองด้วยปุ่ม ต่อ ›" : ""; }

  $("progress").innerHTML = S.map(() => "<i></i>").join("");
  const clear = () => { timers.forEach(clearTimeout); timers = []; if (synth) synth.cancel(); };
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));

  function tapAt(el) {
    const r = el.getBoundingClientRect(), p = screen.parentElement.getBoundingClientRect();
    const x = r.left - p.left + r.width * 0.6, y = r.top - p.top + r.height * 0.55;
    finger.style.opacity = 1; finger.style.left = x + "px"; finger.style.top = y + "px";
    later(850, () => {
      const rp = document.createElement("div"); rp.className = "ripple"; rp.style.left = x + 10 + "px"; rp.style.top = y + 6 + "px";
      screen.parentElement.appendChild(rp); later(800, () => rp.remove());
      el.classList.add("hot"); later(600, () => el.classList.remove("hot"));
    });
  }

  function show(n) {
    clear(); const id = ++runId;
    i = Math.max(0, Math.min(S.length - 1, n));
    const s = S[i];
    [...$("progress").children].forEach((b, k) => b.classList.toggle("on", k <= i));
    $("step").textContent = `${s.step} · ${i + 1}/${S.length}`;
    $("title").textContent = s.title; $("text").textContent = s.say.replace(/เคลม ดอท บางกอก ดอท โก ดอท ที เอช/g, "claim.bangkok.go.th").replace(/\.(\s|$)/g, " ").trim(); // the dots are pauses for the voice
    $("warn").textContent = s.warn || ""; $("warn").classList.toggle("hide", !s.warn);
    $("prev").disabled = i === 0; $("next").textContent = i === S.length - 1 ? "จบ ✓" : "ต่อ ›";
    finger.style.opacity = 0;
    screen.innerHTML = `<div class="bar"><b>BKK</b> Claim Bangkok</div><div class="url">🔒 claim.bangkok.go.th</div><div class="body"></div>`;
    const body = screen.querySelector(".body");
    const els = s.screen.map(([kind, html, act]) => { const d = document.createElement("div"); d.className = "el " + kind; d.innerHTML = html; d.dataset.act = act || ""; body.appendChild(d); return d; });
    // elements appear one by one; taps and ticks follow along the narration
    const per = Math.max(900, Math.min(2200, (s.say.length * 70) / (els.length + 1)));
    els.forEach((d, k) => later(300 + k * per, () => {
      if (id !== runId) return;
      d.classList.add("in");
      if (d.dataset.act === "tap") later(500, () => tapAt(d));
      if (d.dataset.act === "tick") later(500, () => d.classList.add("done"));
    }));
    speak(s, id, els.length * per + 1200);
  }

  function speak(s, id, minMs) {
    const advance = () => { if (id === runId && playing && i < S.length - 1) later(900, () => id === runId && show(i + 1)); };
    if (sound && synth && voice) {
      const u = new SpeechSynthesisUtterance(s.say); u.voice = voice; u.lang = voice.lang; u.rate = 0.92;
      let spoke = false; u.onend = () => { spoke = true; advance(); };
      synth.speak(u);
      later(Math.max(minMs, s.say.length * 160), () => { if (!spoke) advance(); }); // some phones never fire onend
    } else {
      later(Math.max(minMs, s.say.length * 75), advance); // reading pace for captions
    }
  }

  $("next").onclick = () => (i === S.length - 1 ? (location.href = "/") : show(i + 1));
  $("prev").onclick = () => show(i - 1);
  $("again").onclick = () => show(i);
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸ หยุด" : "▶ เล่นต่อ"; if (playing) show(i); else clear(); };
  $("sound").onclick = () => { sound = !sound; $("sound").textContent = sound ? "🔊 เสียง: เปิด" : "🔇 เสียง: ปิด"; show(i); };
  const go = (withSound) => { sound = withSound; $("sound").textContent = sound ? "🔊 เสียง: เปิด" : "🔇 เสียง: ปิด"; $("start").classList.add("hide"); voice = pickVoice(); note(); show(0); };
  $("goSound").onclick = () => go(true);
  $("goMute").onclick = () => go(false);
  note();
})();
</script>
</body>
</html>
